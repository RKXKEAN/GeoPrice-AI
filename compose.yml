name: geoprice

services:
  postgres:
    image: postgres:15-alpine
    container_name: geoprice-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geoprice-redis
    restart: always
    command: redis-server --appendonly yes   
    ports:
      - "6379:6379"
    volumes:                                 
      - redis_data:/data                     

  minio:
    image: quay.io/minio/minio:latest
    container_name: geoprice-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: 
      context: ./backend
    container_name: geoprice-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend/app:/app/app

  mlflow:
    build: 
      context: ./mlflow
    container_name: geoprice-mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      # MLflow ใช้ไลบรารี boto3 ซึ่งจะมองหาตัวแปร AWS โดยอัตโนมัติในการเชื่อมต่อ S3
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mlflow_db
    depends_on:
      - postgres
      - minio

  ai_worker:
    build: 
      context: ./ai_worker
    container_name: geoprice-ai-worker
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_URL=minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - redis
      - minio
      - mlflow
      - backend
    volumes:
      - ./ai_worker:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  label_studio:
    image: heartexlabs/label-studio:latest
    container_name: geoprice-label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME}
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD}
    volumes:
      - label_studio_data:/label-studio/data

  frontend:
    build:
      context: ./frontend
    container_name: geoprice-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  minio_data:
  label_studio_data:
  redis_data:
